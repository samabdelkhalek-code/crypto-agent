  <!-- Candlestick bars -->
  <rect x="8.5" y="20" width="2" height="4" rx="0.5" fill="#10B981" opacity="0.5"/>
  <rect x="13" y="15" width="2" height="5" rx="0.5" fill="#10B981" opacity="0.5"/>
  <rect x="17.5" y="17" width="2" height="4" rx="0.5" fill="#EF4444" opacity="0.4"/>
  <rect x="22" y="10" width="2" height="4" rx="0.5" fill="#10B981" opacity="0.5"/>
