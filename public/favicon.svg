<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0A0F1E"/>
  <!-- Hexagon ring -->
  <polygon points="16,2.5 27.5,9 27.5,23 16,29.5 4.5,23 4.5,9" fill="none" stroke="#1e3a5f" stroke-width="1.2"/>
